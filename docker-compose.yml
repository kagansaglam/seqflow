services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seqflow
      POSTGRES_PASSWORD: seqflow
      POSTGRES_DB: seqflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seqflow"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
