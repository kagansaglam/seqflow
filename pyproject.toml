[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seqflow"
version = "0.1.0"
description = "Automated sequencing-run processing: run detection, demultiplexing, checksums, tracking database, downstream pipeline launch and reporting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
seqflow = "seqflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"seqflow.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=seqflow --cov-report=term-missing"
markers = ["postgres: needs a PostgreSQL server (set SEQFLOW_TEST_PG_URL)"]

[tool.coverage.run]
# Migration scripts are executed by test_migrations.py (SQLite) and test_postgres.py
# (PostgreSQL); line coverage of them is not meaningful.
omit = ["*/seqflow/migrations/*"]

[tool.ruff]
line-length = 100
